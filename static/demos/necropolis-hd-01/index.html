<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>墓园城高清对照</title><style>body{background:#171a1c;color:#ddd;font:16px system-ui;margin:24px auto;max-width:1600px;padding:12px}a{color:#9cd4dd}figure{margin:20px 0}img{max-width:100%;display:block}button{padding:9px 20px;margin-right:8px;cursor:pointer}figcaption,p{line-height:1.7}#city{width:100%;aspect-ratio:800/374;object-fit:fill}.maps{display:flex;gap:18px;flex-wrap:wrap}.maps figure{width:min(46%,600px)}.maps img{width:100%;background:#45494b}.pixel{image-rendering:pixelated}</style><h1>墓园城高清对照</h1><p>城内全景和大地图城堡的首轮效果图。尚未作为替换包安装：全景需要分层，大地图草稿仍含绘制的棋盘背景。</p><h2>城内全景</h2><p><button onclick="showCity(false)">原版 800×374</button><button onclick="showCity(true)">高清 1832×858</button><a href="town-hd.png" target="_blank">打开高清原图</a></p><figure><img id="city" src="town-hd.png" alt="墓园城高清全景"><figcaption id="caption">高清效果图；建筑轮廓与位置仍需逐层校准。</figcaption></figure><h2>大地图城堡</h2><div class="maps"><figure><img class="pixel" src="map-fort-original.png" alt="原版墓园城堡"><figcaption>原版 192×192，透明底。灰底仅用于显示。</figcaption></figure><figure><img src="map-fort-draft-checkerboard.png" alt="高清墓园城堡草稿"><figcaption>高清草稿 1254×1254。棋盘格是图片内容，真实透明通道待处理。</figcaption></figure></div><p><a href="prompts.md">完整提示词</a> · 使用内置 image_gen。未改游戏配置、点击范围或占地。</p><script>function showCity(hd){const im=document.getElementById('city');im.src=hd?'town-hd.png':'town-original.png';im.className=hd?'':'pixel';document.getElementById('caption').textContent=hd?'高清效果图；建筑轮廓与位置仍需逐层校准。':'原版图层按配置位置合成，使用最近邻放大显示。';}</script></html>
