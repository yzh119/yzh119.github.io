{{ define "main" }}
{{ if .Title }}<h1 class="page-title">{{ .Title }}</h1>{{ end }}
{{ .Content }}
<ul class="post-list">
  {{ range .Pages }}
  <li>
    <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006-01-02" }}</time>
    <a href="{{ .Permalink }}">{{ .Title }}</a>
  </li>
  {{ end }}
</ul>
{{ end }}
